; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; Upload can finish before the Teensy's USB serial port reappears.
extra_scripts = post:scripts/wait_for_monitor.py
lib_deps =
	tomstewart89/BasicLinearAlgebra@^5.1
	adafruit/Adafruit GFX Library@^1.11.10
	asukiaaa/MPU9250_asukiaaa@^1.5.13
; The post-upload hook waits for this USB port before monitor discovery.
monitor_port = /dev/cu.usbmodem*
; Teensy considers a USB serial reader connected only while DTR is asserted.
monitor_dtr = 1
monitor_eol = LF
monitor_filters = default, log2file
